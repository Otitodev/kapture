name: Site
on:
  push:
    paths:
      - 'site/**'
      - 'assets/**'
      - 'design/store/**'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'assets/**'
      - 'design/store/**'
      - '.github/workflows/site.yml'

jobs:
  build-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter kapture-site run check
      - run: pnpm --filter kapture-site run build
